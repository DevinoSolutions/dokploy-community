name: Dokploy release
description: >-
  Publishes a release for Dokploy: a manifest uploaded as the run artifact
  dokploy-release, and one GitHub Deployment per service as the wake-up record.
  Needs no Dokploy address and no Dokploy API key.
author: DevinoSolutions
branding:
  icon: upload-cloud
  color: blue

inputs:
  service:
    description: Service key (the Deployment task is dokploy:<key>). Use services for several.
    required: false
  services:
    description: Service keys, one per line.
    required: false
  existing-image:
    description: >-
      Images your own job built and pushed, taken from an output of a job in the
      same run. One line per image, <repository>@sha256:<digest>. With several
      services write <key>=<image> or <key>/<compose service>=<image>. A tag is refused.
    required: true
  environment:
    description: GitHub Environment of the release (its deployment branch policy must allow only the tracked branch).
    required: true
  delivery:
    description: "pull: Dokploy deploys from this release. push: your workflow still deploys; Dokploy only verifies the release."
    required: false
    default: pull
  compose:
    description: Path of the compose file in the repository, when the service is a compose stack.
    required: false
  github-token:
    description: Token used to create the Deployments. Needs deployments write.
    required: false
    default: ${{ github.token }}
  image:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  dockerfile:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  context:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  builder:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  registry:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  mode:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  migrations:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  cache:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  environments:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  secrets:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  build-args:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false
  target:
    description: Reserved for a later version. Any non-empty value is refused in v1.
    required: false

outputs:
  release-id:
    description: The release id, gh-<run id>.<attempt>.
    value: ${{ steps.manifest.outputs.release-id }}
  artifact-uploaded:
    description: "true when the dokploy-release artifact was uploaded; false when the upload failed (storage quota) and Dokploy reads the manifest from this job's log."
    value: ${{ steps.upload.outcome == 'success' }}

runs:
  using: composite
  steps:
    # ARC runner images do not have node on PATH.
    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        package-manager-cache: false

    - name: Build the release manifest
      id: manifest
      shell: bash
      env:
        INPUT_SERVICE: ${{ inputs.service }}
        INPUT_SERVICES: ${{ inputs.services }}
        INPUT_EXISTING_IMAGE: ${{ inputs.existing-image }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_DELIVERY: ${{ inputs.delivery }}
        INPUT_COMPOSE: ${{ inputs.compose }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_BUILDER: ${{ inputs.builder }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MIGRATIONS: ${{ inputs.migrations }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_ENVIRONMENTS: ${{ inputs.environments }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_BUILD_ARGS: ${{ inputs.build-args }}
        INPUT_TARGET: ${{ inputs.target }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/cli.mjs" manifest

    - name: Upload the release manifest
      id: upload
      if: steps.manifest.outputs.published == 'true'
      # Never fatal: when GitHub blocks the upload (Actions storage quota) Dokploy reads the manifest
      # from this job's log (the "dokploy-release/v1 <payload>" line the manifest step printed).
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dokploy-release
        path: ${{ steps.manifest.outputs.path }}
        retention-days: 7
        if-no-files-found: error
        # A re-run attempt replaces the artifact; Dokploy treats an older attempt as superseded.
        overwrite: true

    - name: Artifact upload failed
      if: steps.manifest.outputs.published == 'true' && steps.upload.outcome == 'failure'
      shell: bash
      run: echo "::warning title=dokploy-release::The artifact upload failed; Dokploy reads the manifest from this job's log instead."

    - name: Create the GitHub Deployments
      # The manifest is in the run artifact or, failing that, in this job's log: either is enough to wake Dokploy.
      if: steps.manifest.outputs.published == 'true'
      shell: bash
      env:
        INPUT_DELIVERY: ${{ inputs.delivery }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/cli.mjs" deploy
