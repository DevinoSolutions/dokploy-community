# Mirrors check 1 of the org's DevinoSolutions/.github security-audit.yml
# (pnpm audit at high). That reusable workflow lives in a private repo and
# cannot be called from this public one. Check 2 (stale override floors) is
# not included.
#
# Ignored advisories live in package.json (pnpm.auditConfig.ignoreGhsas):
# - GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high), added 2026-11-17: no patched
#   release exists (every version up to 4.0.7 is affected). It reaches the tree
#   through vite (build time) and micromatch. micromatch runs on the server:
#   packages/server/src/utils/watch-paths/should-deploy.ts matches a service's
#   watch paths against the file list of a git webhook. Watch paths are now
#   refused at the API when they hold extglob, brace or other slow syntax
#   (utils/watch-paths/validate-watch-paths.ts), and should-deploy.ts re-checks
#   stored rows and matches with noextglob/nobrace. The mute is DATED: its
#   expiry and reason sit in package.json `auditIgnoreExpiry`, and the "Check
#   dated audit mutes" step fails this job once the date passes (or when the entry is
#   missing a reason, malformed or more than 30 days out). Remove the ignore
#   and raise picomatch once a fixed release is out (micromatch/picomatch#194).
name: Security audit

on:
  pull_request:
    branches: [canary]
    paths:
      - pnpm-lock.yaml
      - "**/package.json"
      - pnpm-workspace.yaml
      - .github/workflows/security-audit.yml
      - scripts/check-audit-ignore-expiry.mjs
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      # Before the audit: a dated mute that expired keeps this job red until
      # someone re-reviews the advisory (see the header and package.json).
      - name: Check dated audit mutes
        run: node scripts/check-audit-ignore-expiry.mjs
      - run: pnpm audit --audit-level=high
