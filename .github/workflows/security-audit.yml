# Mirrors check 1 of the org's DevinoSolutions/.github security-audit.yml
# (pnpm audit at high). That reusable workflow lives in a private repo and
# cannot be called from this public one. Check 2 (stale override floors) is
# not included.
#
# Ignored advisories live in package.json (pnpm.auditConfig.ignoreGhsas):
# - GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high), added 2026-11-17: no patched
#   release exists (every version up to 4.0.7 is affected). It reaches the tree
#   through vite (build time) and micromatch. micromatch runs on the server:
#   packages/server/src/utils/watch-paths/should-deploy.ts matches a service's
#   watch paths, which a signed-in member with edit rights on that service sets,
#   against the file list of a git webhook. So a member could store a slow
#   pattern; it is not reachable without an account. Remove the ignore and
#   raise picomatch once a fixed release is out; re-check by 2026-12-17.
name: Security audit

on:
  pull_request:
    branches: [canary]
    paths:
      - pnpm-lock.yaml
      - "**/package.json"
      - pnpm-workspace.yaml
      - .github/workflows/security-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm audit --audit-level=high
