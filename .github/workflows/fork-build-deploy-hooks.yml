name: Fork Build Deploy Hooks (GHCR)

# Fork-only image build for the pre/post-deploy hooks feature branch (ports
# upstream Dokploy/dokploy#4240, issue #110). Pushes to a DISTINCT tag so it
# never clobbers :canary / :ux-all / :metrics-org / :social-login.

on:
  push:
    branches: [test/deploy-hooks-build]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/devinosolutions/dokploy-community

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:deploy-hooks
            ${{ env.IMAGE }}:deploy-hooks-${{ github.sha }}
