name: Dokploy Docker Build

on:
  push:
    branches: [canary]
    # A docs-only merge must not republish the image. This workflow retags
    # `canary`, `latest` and the package.json version on every push, so any
    # merge to canary moves all three to a new digest - including a merge that
    # changes nothing the image contains. That breaks the one operating
    # procedure that depends on those tags being stable: capturing the running
    # digest before a version roll, so there is something to roll back to.
    # See docs/build-once-rollout-runbook.md, section 2.1.
    #
    # workflow_dispatch is untouched, so a deliberate rebuild is always one
    # click away.
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/devinosolutions/dokploy-community

jobs:
  docker-amd:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set tag and version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          TAG="canary"
          echo "tags=${IMAGE_NAME}:${TAG}-amd64" >> $GITHUB_OUTPUT

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  docker-arm:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set tag and version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          TAG="canary"
          echo "tags=${IMAGE_NAME}:${TAG}-arm64" >> $GITHUB_OUTPUT

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  combine-manifests:
    needs: [docker-amd, docker-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create and push manifests
        env:
          # This run's own builds. The canary-amd64 and canary-arm64 tags can
          # already belong to another run that finished its builds first.
          AMD64: ${{ env.IMAGE_NAME }}@${{ needs.docker-amd.outputs.digest }}
          ARM64: ${{ env.IMAGE_NAME }}@${{ needs.docker-arm.outputs.digest }}
          # Canary's tip before this push; empty on a manual run.
          BEFORE: ${{ github.event.before }}
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          TAG="canary"

          # Runs can finish out of order. Only the run for canary's current tip
          # moves canary and latest, so they never go back to older code.
          if [ "$(git ls-remote origin refs/heads/canary | cut -f1)" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create -t ${IMAGE_NAME}:${TAG} "$AMD64" "$ARM64"
            docker buildx imagetools create -t ${IMAGE_NAME}:latest "$AMD64" "$ARM64"
          else
            echo "canary has moved past ${GITHUB_SHA}; leaving canary and latest alone."
          fi

          # A version tag names the release that set that version. Merges that
          # land after it keep the same package.json version, and retagging the
          # version on each of them would put unreleased code under a released
          # version. So the tag is published only by the push that changes the
          # version. A manual run republishes it: run one only while the release
          # commit is still canary's tip.
          PREVIOUS=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true
            PREVIOUS=$(git show "$BEFORE:apps/dokploy/package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
          fi
          if [ "$VERSION" != "$PREVIOUS" ]; then
            docker buildx imagetools create -t ${IMAGE_NAME}:${VERSION} "$AMD64" "$ARM64"
          else
            echo "This push does not change the version; keeping the ${VERSION} tag."
          fi
